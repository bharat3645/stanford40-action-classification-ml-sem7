name: Lint and Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile-check all Python files (catches syntax errors)
        run: |
          python -m py_compile *.py

      - name: Install flake8
        run: pip install flake8

      - name: Lint for errors (undefined names, syntax issues)
        run: |
          # E9: syntax errors, F63/F7/F82: undefined names and misuse -- these
          # are real bugs, not style opinions, and don't require project
          # dependencies (tensorflow, etc.) to be installed.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
